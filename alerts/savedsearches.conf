# savedsearches.conf — alert stanzas for the SRE toolkit.
#
# Install: merge into your Splunk app's local/savedsearches.conf and reload.
# Set action.email.to to a real distribution list before enabling.
#
# Placeholders you must set (search for CHANGE_ME):
#   CHANGE_ME@example.com  -> on-call email distribution list

[Error Rate Spike]
# Fires when any service's 5-minute error rate exceeds 5%.
description = Alert when a service's 5xx error rate exceeds 5% over 5 minutes
search = index=web sourcetype=access_combined \
    | eval service=coalesce(service, "unknown") \
    | eval is_error=if(status>=500, 1, 0) \
    | bin _time span=5m \
    | stats sum(is_error) as errors count as total by _time, service \
    | eval error_rate=round(errors/total*100, 2) \
    | where error_rate > 5
cron_schedule = */5 * * * *
dispatch.earliest_time = -5m
dispatch.latest_time = now
alert.severity = 4
alert.suppress = 1
alert.suppress.fields = service
alert.suppress.period = 30m
alert.track = 1
action.email = 1
action.email.to = CHANGE_ME@example.com
action.email.priority = 2
action.email.subject = [SEV-2] Error rate spike: $result.service$ at $result.error_rate$%
action.email.message = Service $result.service$ has a 5xx error rate of $result.error_rate$% over the last 5 minutes. Runbook: check service health, recent deploys, and downstream dependencies.

[Failed Login Burst]
# Fires when a single source IP fails 20+ logins in 10 minutes.
description = Alert on brute-force login bursts (>20 failures per src_ip in 10m)
search = index=auth sourcetype=secure action="failed_login" \
    | bin _time span=10m \
    | stats count as failures dc(user) as distinct_users values(user) as users by _time, src_ip \
    | where failures > 20
cron_schedule = */10 * * * *
dispatch.earliest_time = -10m
dispatch.latest_time = now
alert.severity = 3
alert.suppress = 1
alert.suppress.fields = src_ip
alert.suppress.period = 60m
alert.track = 1
action.email = 1
action.email.to = CHANGE_ME@example.com
action.email.priority = 1
action.email.subject = [SEV-1] Possible brute force from $result.src_ip$
action.email.message = $result.failures$ failed logins from $result.src_ip$ in 10 minutes targeting $result.distinct_users$ user(s): $result.users$. Check for a subsequent accepted_login from this IP; if one exists, treat as a suspected compromise.
